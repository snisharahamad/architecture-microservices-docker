services:
  portainer:
    image: portainer/portainer-ce:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.sahil.matrice`)"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    networks:
      - infra-traefik_default

volumes:
  portainer_data:

networks:
  infra-traefik_default:
    external: true
